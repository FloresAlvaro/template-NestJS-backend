name: tienda-local

services:
  mailpit:
    image: axllent/mailpit:v1.31.5
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: "100"
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tienda
      POSTGRES_PASSWORD: tienda_local
      POSTGRES_DB: tienda
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tienda -d tienda"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build: .
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: postgresql://tienda:tienda_local@db:5432/tienda?schema=public
      PORT: "3001"
      ORDER_RESERVATION_MINUTES: "${ORDER_RESERVATION_MINUTES:-1440}"
      COOKIE_SECURE: "false"
      TRUSTED_ORIGINS: http://localhost:3000,http://localhost:3001
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      SMTP_REQUIRE_TLS: "false"
      MAIL_FROM: no-reply@tienda.local
      PASSWORD_RESET_URL: http://localhost:3001/api/auth/reset-password
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      mailpit:
        condition: service_started
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:

