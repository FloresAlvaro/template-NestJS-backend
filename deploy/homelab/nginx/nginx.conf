worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Exclude paths/queries from access logs: reset links may contain tokens.
    log_format safe '$remote_addr [$time_local] $request_method $status $body_bytes_sent $request_time';
    access_log /dev/stdout safe;
    server_tokens off;
    client_max_body_size 12m;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    keepalive_timeout 30;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server {
        listen 8080;
        return 308 ${PUBLIC_ORIGIN}$request_uri;
    }
    server {
        listen 8443 ssl;
        http2 on;
        server_name _;
        ssl_certificate /etc/nginx/tls/server.crt;
        ssl_certificate_key /etc/nginx/tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:10m;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        location / {
            set $frontend http://frontend:3000;
            proxy_pass $frontend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            # Overwrite incoming assertions; Nuxt trusts only this immediate peer.
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header Forwarded "";
            proxy_set_header X-Tienda-Client-Ip "";
            proxy_set_header X-Tienda-Client-At "";
            proxy_set_header X-Tienda-Client-Signature "";
            proxy_cache off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            # Avoid proxy retries of operations that may already have committed.
            proxy_next_upstream off;
        }
    }
}
