name: ${COMPOSE_PROJECT_NAME:-tienda-homelab}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
x-app: &app
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=128m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging: *logging

services:
  nginx:
    <<: *app
    image: nginx:1.28-alpine
    user: "101:101"
    entrypoint: [sh, /etc/nginx/start.sh]
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN}
    mem_limit: 128m
    cpus: 0.5
    ports:
      - "${BIND_IP:-127.0.0.1}:${HTTP_PORT:-80}:8080"
      - "${BIND_IP:-127.0.0.1}:${HTTPS_PORT:-443}:8443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf.template:ro
      - ./nginx/start.sh:/etc/nginx/start.sh:ro
      - ./private/tls:/etc/nginx/tls:ro
    networks:
      edge:
        ipv4_address: ${NGINX_IP:-172.30.72.2}
    depends_on:
      frontend:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "wget -q --no-check-certificate -O /dev/null https://127.0.0.1:8443/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
  frontend:
    <<: *app
    image: tienda-frontend:${IMAGE_TAG:-homelab}
    build:
      context: ${FRONTEND_CONTEXT:-../../../template-NuxtJS-frontend}
    mem_limit: 768m
    cpus: 1.0
    environment:
      NUXT_BACKEND_API_BASE: http://backend:3001/api
      NUXT_AUTH_PROXY_SECRET: ${AUTH_PROXY_SECRET:?Run init.sh first}
      NUXT_TRUSTED_PROXY_IP: ${NGINX_IP:-172.30.72.2}
      # Nitro image processing may cache files under /tmp.
      NITRO_PRESET: node-server
    networks:
      edge:
        ipv4_address: ${FRONTEND_IP:-172.30.72.3}
      api: {}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
  backend:
    <<: *app
    image: tienda-backend:${IMAGE_TAG:-homelab}
    build:
      context: ../..
    mem_limit: 768m
    cpus: 1.0
    environment:
      DATABASE_URL: postgresql://tienda:${POSTGRES_PASSWORD:?Run init.sh first}@db:5432/${POSTGRES_DB:-tienda}?schema=public
      AUTH_PROXY_SECRET: ${AUTH_PROXY_SECRET:?Run init.sh first}
      COOKIE_SECURE: "true"
      TRUSTED_ORIGINS: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN}
      PASSWORD_RESET_URL: ${PUBLIC_ORIGIN}/reset-password
      PORT: "3001"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      SMTP_REQUIRE_TLS: "false"
      MAIL_FROM: no-reply@tienda.home.arpa
      ORDER_RESERVATION_MINUTES: "1440"
    networks: [api, data]
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    security_opt: [no-new-privileges:true]
    command: [postgres, -c, max_connections=50, -c, shared_buffers=128MB]
    environment:
      POSTGRES_USER: tienda
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run init.sh first}
      POSTGRES_DB: ${POSTGRES_DB:-tienda}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U tienda -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging
  mailpit:
    <<: *app
    image: axllent/mailpit:v1.31.5
    user: "1000:1000"
    mem_limit: 128m
    cpus: 0.5
    environment:
      MP_MAX_MESSAGES: "100"
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8026}:8025"
    networks: [api, management]

networks:
  edge:
    ipam:
      config:
        - subnet: ${EDGE_SUBNET:-172.30.72.0/24}
  api:
    internal: true
  data:
    internal: true
  management: {}
volumes:
  postgres_data:
